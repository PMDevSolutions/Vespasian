name: GUI Tests

on:
  pull_request:
    paths:
      - 'packages/gui/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gui.yml'
  push:
    branches: [main]
    paths:
      - 'packages/gui/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gui.yml'

jobs:
  gui:
    runs-on: ubuntu-latest
    # The GUI's orchestration core is pure Node/TS and tests run headless — no
    # Electron window is launched, so this lane needs no display server.
    steps:
      - uses: actions/checkout@v4

      # pnpm via Corepack — the pnpm/action-setup marketplace action isn't on this
      # repo's allowed-actions list (see pipeline-tests.yml).
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          # 22, not 20: the test script uses `node --test "<glob>"`, and test-runner
          # glob support landed in Node 21 (matches init-wizard.yml).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # Skip the ~100 MB Electron binary download — typecheck needs only the
        # bundled types and the core tests never launch Electron.
        # side-effects-cache=false: pnpm would otherwise record this *skipped*
        # Electron postinstall in the pnpm store (which setup-node caches, keyed
        # on the lockfile — shared with the smoke job), and any later install
        # restoring that cache would replay it and never get a binary
        # ("Electron failed to install correctly").
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile --config.side-effects-cache=false

      - name: Lint
        run: pnpm --filter @vespasian/gui lint

      - name: Typecheck
        run: pnpm --filter @vespasian/gui typecheck

      - name: Run GUI unit tests
        run: pnpm --filter @vespasian/gui test

  smoke:
    # Launches the built Electron app headlessly (Xvfb) and asserts it reaches the
    # setup view. Separate job because it needs the Electron binary + a display.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # No ELECTRON_SKIP here — the smoke needs the real Electron binary.
        # side-effects-cache=false: don't replay postinstall results from the
        # restored store cache — an install that ran with
        # ELECTRON_SKIP_BINARY_DOWNLOAD=1 records a binary-less Electron build,
        # and replaying it here is what breaks electron.launch. This forces
        # Electron's postinstall to really run (and really download).
        run: pnpm install --frozen-lockfile --config.side-effects-cache=false

      - name: Install Electron runtime libraries + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pnpm --filter @vespasian/gui exec playwright install-deps chromium

      - name: Build GUI
        run: pnpm --filter @vespasian/gui build

      - name: Smoke test (app launches and reaches the setup view)
        run: xvfb-run --auto-servernum pnpm --filter @vespasian/gui smoke
