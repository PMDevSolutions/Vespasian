name: Validate Agent Configs

on:
  push:
    paths:
      - '.claude/**'
      - 'scripts/validate-agent-configs*.sh'
      - 'tests/validate-agent-configs.bats'
      - 'tests/fixtures/**'
  pull_request:
    paths:
      - '.claude/**'
      - 'scripts/validate-agent-configs*.sh'
      - 'tests/validate-agent-configs.bats'
      - 'tests/fixtures/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install jq
        # jq is preinstalled on GitHub-hosted runners; apt is a flaky fallback only
        run: command -v jq >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq jq)

      - name: Run validation tests
        run: tests/bats/bin/bats tests/validate-agent-configs.bats

      - name: Validate agent configurations
        run: ./scripts/validate-agent-configs-ci.sh
