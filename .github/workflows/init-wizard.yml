name: Init Wizard Tests

on:
  push:
    paths:
      - 'scripts/init.mjs'
      - 'scripts/init/**'
      - 'scripts/canva-wix/**'
      - 'tests/init/**'
      - 'tests/fixtures/canva/**'
      - '.claude/templates/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/init-wizard.yml'
  pull_request:
    paths:
      - 'scripts/init.mjs'
      - 'scripts/init/**'
      - 'scripts/canva-wix/**'
      - 'tests/init/**'
      - 'tests/fixtures/canva/**'
      - '.claude/templates/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/init-wizard.yml'

jobs:
  init-wizard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm via Corepack — pnpm/action-setup isn't on the allowed-actions list.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          # Node 22 is the repo-wide floor (engines >=22.13.0; Node 20 is EOL).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run init wizard tests
        run: pnpm run test:init
