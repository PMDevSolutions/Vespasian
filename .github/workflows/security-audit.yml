name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'package-lock.json'
      - 'packages/**/package.json'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # pnpm via Corepack — pnpm/action-setup isn't on the allowed-actions list.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Run dependency scan
        id: scan
        run: |
          chmod +x scripts/security-audit/scan-dependencies.sh
          chmod +x scripts/security-audit/generate-report.sh
          SCAN_OUTPUT=$(./scripts/security-audit/scan-dependencies.sh . 2>/dev/null) || true
          echo "$SCAN_OUTPUT" > /tmp/scan-output.json
          echo "$SCAN_OUTPUT" | ./scripts/security-audit/generate-report.sh > /dev/null 2>&1 || true
          CRITICAL=$(echo "$SCAN_OUTPUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d['results'] for v in r['vulnerabilities'] if v.get('severity')=='critical'))" 2>/dev/null || echo "0")
          HIGH=$(echo "$SCAN_OUTPUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d['results'] for v in r['vulnerabilities'] if v.get('severity')=='high'))" 2>/dev/null || echo "0")
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: .claude/security-reports/
          retention-days: 90
        if: always()

      - name: Fail on critical vulnerabilities
        if: steps.scan.outputs.critical != '0'
        run: |
          echo "::error::${{ steps.scan.outputs.critical }} critical vulnerability(ies) found. See security report artifact."
          exit 1
