name: visual-regression

# Capture + pixelmatch diff of the PUBLISHED WIX SITE vs committed baselines.
#
# Needs the `WIX_SITE_URL` repository VARIABLE (Settings → Secrets and
# variables → Actions → Variables). When it is not configured — forks, fresh
# clones, pre-first-publish — the workflow skips with a clear notice instead
# of failing. Because it screenshots a live deployed site rather than the
# PR's code, it runs on main pushes, a weekly cron, and manual dispatch.
#
# Bootstrap mode (workflow_dispatch with bootstrap=true) captures fresh
# baselines on the runner and commits them — use after an intentional,
# published UI change.

on:
  push:
    branches: [main]
    paths:
      - "tests/visual/**"
      - "scripts/visual-*"
      - "scripts/visual-diff.js"
      - ".github/workflows/visual-regression.yml"
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Capture baselines and commit them to this branch (use after a published UI change). Requires write access."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  checks: write

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    name: Capture + diff
    runs-on: ubuntu-latest
    steps:
      - name: Check WIX_SITE_URL is configured
        id: gate
        env:
          WIX_SITE_URL: ${{ vars.WIX_SITE_URL }}
        run: |
          if [ -z "$WIX_SITE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Visual regression skipped::Set the WIX_SITE_URL repository variable to the published Wix site to enable visual regression."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 20
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # pnpm via Corepack — pnpm/action-setup isn't on the allowed-actions list.
      - name: Enable Corepack (pnpm)
        if: steps.gate.outputs.configured == 'true'
        run: corepack enable

      - name: Restore pnpm store
        if: steps.gate.outputs.configured == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install Node deps
        if: steps.gate.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.gate.outputs.configured == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture screenshots
        if: steps.gate.outputs.configured == 'true'
        env:
          WIX_SITE_URL: ${{ vars.WIX_SITE_URL }}
        run: pnpm visual:capture -- --out tests/visual/actual

      - name: Detect missing baselines
        if: steps.gate.outputs.configured == 'true'
        id: baselines
        run: |
          shopt -s nullglob
          baseline_count=$(ls tests/visual/baselines/*.png 2>/dev/null | wc -l)
          actual_count=$(ls tests/visual/actual/*.png 2>/dev/null | wc -l)
          echo "baseline_count=$baseline_count" >> "$GITHUB_OUTPUT"
          echo "actual_count=$actual_count"     >> "$GITHUB_OUTPUT"
          if [ "$baseline_count" -eq 0 ]; then
            echo "::warning title=No baselines committed::tests/visual/baselines/ is empty. Run the 'visual-regression' workflow with bootstrap=true to populate it, or run scripts/visual-update-baselines.sh locally."
          fi

      - name: Diff vs baselines
        if: steps.gate.outputs.configured == 'true' && steps.baselines.outputs.baseline_count != '0' && github.event.inputs.bootstrap != 'true'
        run: pnpm visual:diff

      - name: Upload artifacts (actual, diffs, report)
        if: always() && steps.gate.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            tests/visual/actual/
            tests/visual/diffs/
            tests/visual/report.json
          if-no-files-found: ignore
          retention-days: 14

      # --- Bootstrap path: commit fresh baselines back to the branch ---
      - name: Promote actuals to baselines (bootstrap)
        if: steps.gate.outputs.configured == 'true' && github.event.inputs.bootstrap == 'true'
        run: |
          rm -f tests/visual/baselines/*.png
          cp tests/visual/actual/*.png tests/visual/baselines/
          ls -la tests/visual/baselines/

      - name: Commit baselines (bootstrap)
        if: steps.gate.outputs.configured == 'true' && github.event.inputs.bootstrap == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/baselines/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "test(visual): bootstrap baselines [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
